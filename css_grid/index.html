<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID</title>
    <style>
        .container
        {
            border: 2px solid black;
          
            display: grid;
            grid-template-columns: 100px 100px 100px 100px;
             /* grid-template-columns: [pehla] 100px [doosra] 100px 100px 100px; we can name like this */
             grid-template-rows: 100px 100px;
             /*every column will be 100px and it make 2 columns */
             /* grid-template-rows: 100px 100px; */
             /* alignitems - centre means column wise centre
                justify items - centre means row wise centre chestadi */
                /* if container is very much bigger than boxes or items use justify content - it makes row wise  centre , if  align content used it makes column wise centre*/

        }
        .items
        {
            border: 2px solid black;/**/
            /* width: 100px;
            height: 100px; */
            background-color: aqua;
        }
        .item-1{
            grid-column: 1/2; /*means 1 column par start  2 column par end 
            /* grid-column: pehla/doosra; same as grid-column 1/2 */
            grid-row: 1/2;
        }
        .item-2{
            grid-column: 1/2;
            /* u can also write  grid-column-start ,grid-column end instead of using "/" this symbol */
            grid-row: 1/2;/*same for column*/
        }
        /* if u see item-1 and item-2 properties are same so if u use these 2 classes in 2 items those items will overlap */
    </style>
</head>
<body>
    <div class="container">
        <!-- vimp more than one class in one div never write like this
         class="items" class="item-1"  -->
       <div class="items item-1">dabba1</div>
       <div class="items item-2">dabba2</div>
       <div class="items">dabba3</div>
       <div class="items">dabba4</div>
       <div class="items">dabba5</div>
    </div>
</body>
</html>
