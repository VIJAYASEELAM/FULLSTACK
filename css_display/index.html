<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS DISPLAY PROPERTY</title>
    <style>
        /* * --- this is universal selector */
        *{
            margin: 0px;
            padding: 0px;
        }
       .box {
    border: 2px solid red;

    /* display: inline;
       - Isse element line ke andar aa jaata hai (jaise <span>, <a>).
       - Lekin is case me tum padding/margin top-bottom fully apply nahi kar sakte,
         sirf left-right kaam karega.
       - Aur tum width/height bhi set nahi kar paoge.
    */

    /* display: inline-block;
       - Ye inline ki tarah ek hi line me rehta hai,
         but tum isme width/height, padding, margin sab set kar sakte ho.
       - Example: <img> default inline-block hota hai.
    */

    /* display: none;
       - Isse element gayab ho jaata hai aur uski jagah bhi remove ho jaati hai.
       - Matlab element DOM me hai, par render nahi hota.
    */

    /* visibility: hidden;
       - Isse element gayab ho jaata hai lekin uski jagah (space) abhi bhi reserved rahegi.
       - Matlab box dikhega nahi, but empty space dikhai dega.
    */
}

    </style>
</head>
<body>
    <div class="box">
        Iam a box
     </div>
</body>
</html>
