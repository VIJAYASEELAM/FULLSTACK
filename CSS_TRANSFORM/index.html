<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TRSNSFORMS</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
            background-color: blue;
            border: 2px solid black;
            transform: rotateX(40deg);
            /* transform: scaleX(1.6) ante size increases in xaxis*/
            /*transform scale(1.6) ante size normally*/
          /* we cant skew in z axis */
          /* we can do multiple translations at a time 
            transform:translateY(100%) skewX(40deg) */
          /* 
   transform-origin ka matlab hai ki kis point/side se element transform (rotate, scale, etc.) hoga. 
   By default ye center hota hai. 

   Example:
   - transform-origin: center;   → element center se rotate/scale hoga.
   - transform-origin: left;     → element left side se rotate/scale hoga.
   - transform-origin: right;    → element right side se rotate/scale hoga.
   - transform-origin: top left; → element top-left corner se transform hoga.
   - transform-origin: 50% 100%; → X-axis 50% (center), Y-axis 100% (bottom) se transform hoga.
*/

            transform: rotate(40deg);/*no gap btwn 40 and deg --- syntax dyan se*/
        }
        .container{
            height: 150px;
            width: 150px;
            background-color: rgb(206, 24, 133);
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
